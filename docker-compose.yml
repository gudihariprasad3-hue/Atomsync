version: '3.8'

# ============================================================
# AtmoSync – Docker Compose Services
# ============================================================
# Services:
#   1. zookeeper   – Kafka coordination service
#   2. kafka       – Message broker
#   3. superset    – Apache Superset BI dashboard
# ============================================================
# Usage:
#   Start all:        docker-compose up -d
#   Start Kafka only: docker-compose up -d zookeeper kafka
#   Start Superset:   docker-compose up -d superset
#   View logs:        docker-compose logs -f kafka
#   Stop all:         docker-compose down
# ============================================================

services:

  # ----------------------------------------------------------
  # ZOOKEEPER – Required by Kafka for coordination
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: atmosync-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # KAFKA – Message Broker
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: atmosync-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # APACHE SUPERSET – BI Dashboard
  # ----------------------------------------------------------
  superset:
    image: apache/superset:3.1.3
    container_name: atmosync-superset
    hostname: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "atmosync_super_secret_key_change_in_production"
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@atmosync.local
      ADMIN_PASSWORD: atmosync2024
    volumes:
      - superset-home:/app/superset_home
      - ./dashboard/superset:/app/superset_config
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin
          --username admin
          --firstname Admin
          --lastname User
          --email admin@atmosync.local
          --password atmosync2024 || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  superset-home:
    driver: local
